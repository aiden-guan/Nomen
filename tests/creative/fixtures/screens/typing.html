<!doctype html>
<html><head><meta charset="utf-8">
<title>typing fixture</title>
<style>
body{background:#06070c;color:#fff;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.logo{position:absolute;left:64px;top:220px;width:96px;height:96px}
.term{position:absolute;left:44px;width:992px;top:400px;height:300px;border-radius:40px;background:#121522;box-shadow:0 0 0 3px #1f3cff}
.cmd{position:absolute;left:44px;top:110px;font:600 42px Menlo,"DejaVu Sans Mono",monospace;white-space:pre}
.cursor{display:inline-block;width:24px;height:50px;background:#fff;vertical-align:-8px}
.ok{position:absolute;left:44px;top:760px;padding:24px 40px;border-radius:999px;background:#1f3cff;font-weight:800;font-size:56px}
</style></head>
<body>
<img class="logo" src="__KIT_URL__/logo.svg">
<div class="term"><div class="cmd"><span id="cmd"></span><span class="cursor"></span></div></div>
<div class="ok" id="ok">connected: 2900+ tools</div>
<script>
function render() {
  document.getElementById('cmd').textContent = '> ' + typed('set up https://monid.ai/SKILL.md', 0.2, 30);
  var p = ease(prog(1.3, 1.6));
  var ok = document.getElementById('ok');
  ok.style.opacity = p;
  ok.style.transform = 'translateY(' + (1 - p) * 60 + 'px)';
}
render();
</script>
</body></html>
