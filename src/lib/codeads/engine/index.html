<!doctype html>
<!-- Nomen code-ad render page (adapted from ED Studio's engine/index.html). Loaded by src/lib/codeads/render.ts as
     /engine/index.html; the ad's own files (story.json, logo, screenshots) are served under /ad/.
     Everything on screen = the WebGL canvas (the 3D scene) + the build-genre text overlay (engine/build/captions.js). -->
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
#ui { position: absolute; inset: 0; pointer-events: none; color: #fff; }
</style>
<script type="importmap">
{ "imports": {
    "three": "/three/build/three.module.js",
    "three/addons/": "/three/examples/jsm/",
    "@engine/": "/engine/"
} }
</script>
</head>
<body>
<canvas id="gl" width="1080" height="1920"></canvas>
<div id="ui"></div>
<script type="module" src="/engine/main.js"></script>
</body>
</html>
